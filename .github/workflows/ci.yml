name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies (high+)
        run: pnpm audit --audit-level high

      - name: Build shared package
        run: pnpm --filter @proptech/shared build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint web
        run: pnpm --filter @proptech/web lint

      - name: Lint server
        run: pnpm --filter @proptech/server lint

      - name: Lint mcp-ai
        run: pnpm --filter @proptech/mcp-ai lint

      - name: Shared tests (Zod schemas)
        run: pnpm --filter @proptech/shared test

      - name: MCP-AI tests (Gemini validation)
        run: pnpm --filter @proptech/mcp-ai test

      - name: Server tests (RLS)
        run: pnpm --filter @proptech/server test
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          DEMO_USER_PASSWORD: ${{ secrets.DEMO_USER_PASSWORD }}

      - name: Build server
        run: pnpm --filter @proptech/server build

      - name: Build mcp-ai
        run: pnpm --filter @proptech/mcp-ai build

      - name: Build web
        run: pnpm --filter @proptech/web build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_API_URL: http://localhost:3001

  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: E2E smoke + upload mockeado (sin cuota ni IA)
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          DEMO_USER_PASSWORD: ${{ secrets.DEMO_USER_PASSWORD }}
        run: |
          if [ -z "$E2E_BASE_URL" ] || [ -z "$DEMO_USER_PASSWORD" ]; then
            echo "E2E omitido: configura E2E_BASE_URL y DEMO_USER_PASSWORD en GitHub Secrets"
            exit 0
          fi
          pnpm test:e2e
