version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # eslint-config-next@16.2.11 is not compatible with ESLint 10 yet.
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"
    groups:
      production-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "@types/*"
          - "eslint*"
          - "typescript"
